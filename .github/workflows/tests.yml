name: Tests

on:
  push:
    branches: [main, codex/public-release]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock:
    name: Mock (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Record tested environment
        run: |
          git rev-parse HEAD
          python -c "import os,platform,sys; print(platform.platform()); print(sys.version); print('Runner image:',os.environ.get('ImageOS'),os.environ.get('ImageVersion'))"
      - name: Validate distribution
        run: python tools/check_package.py
      - name: Build committed source and runtime bundles
        run: >-
          python -B -c "import os,subprocess,sys; from pathlib import Path;
          subprocess.run([sys.executable,'-B','tools/build_release.py','--ref','HEAD',
          '--out-dir',str(Path(os.environ['RUNNER_TEMP'])/'gemini-subagent-release')],check=True)"
      - name: Test with mock providers
        run: python -W error::ResourceWarning tools/run_ci_tests.py
      - name: Parse Windows acceptance tooling
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/validate_windows.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw 'Windows validation script has syntax errors.' }
